<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__container">

      <!-- Логотип -->
      <a href="/" class="header__logo logo" aria-label="Coffee House — на главную">
        <img class="logo__image" src="./img/logo.svg" alt="Coffee House" width="100" height="60">
      </a>

      <!-- Основная навигация -->
      <nav class="header__nav" aria-label="Основная навигация">
        <ul class="header__list">
          <li class="header__item">
            <a href="/#slider" class="nav__link nav__link--active">Favorite coffee</a>
          </li>
          <li class="header__item">
            <a href="/#about" class="header__link">About</a>
          </li>
          <li class="header__item">
            <a href="/#app" class="header__link">Mobile app</a>
          </li>
          <li class="header__item">
            <a href="/#contacts" class="header__link">Contact us</a>
          </li>
        </ul>
      </nav>

      <!-- Действия справа -->
      <div class="header__actions">

  <!-- 1. Переключатель темы -->
  <button class="theme-toggle" type="button" aria-label="Переключить светлую и тёмную тему">
    <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true"></span>
    <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true"></span>
  </button>

  <!-- 2. Кнопка Menu с чашкой (видна только на десктопе > 768px) -->
  <a href="/" class="menu-link">
    <span class="menu-link__text">Menu</span>
    <img class="menu-link__icon" src="./img/icons/coffee-cup.svg" alt="" width="20" height="20">
  </a>

  <!-- 3. Круглая кнопка-бургер (видна только ≤ 768px) -->
  <button class="burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-menu">
    <span class="burger__lines" aria-hidden="true"></span>
  </button>

</div>
    </div>
  </header>

</body>
</html>
