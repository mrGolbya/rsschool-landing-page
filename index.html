<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
  <div class="container header__container">

    <!-- Логотип -->
    <a href="index.html" class="header__logo" aria-label="Coffee House — на главную">
      <img src="img/logo.svg" alt="Coffee House" width="100" height="60">
    </a>

    <!-- Основная навигация -->
    <nav class="header__nav" aria-label="Основная навигация">
      <ul class="header__list">
        <li><a href="index.html#slider">Favorite coffee</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#app">Mobile app</a></li>
        <li><a href="index.html#contacts">Contact us</a></li>
      </ul>
    </nav>

    <!-- Действия справа -->
    <div class="header__actions">

      <!-- Переключатель темы -->
      <button class="theme-toggle" type="button"
              aria-label="Переключить светлую и тёмную тему">
        <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="4" fill="currentColor"/>
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </span>
      </button>

      <!-- Menu + чашка (иконка — отдельный SVG через mask) -->
      <button class="menu-btn" type="button"
              aria-label="Открыть меню"
              aria-expanded="false"
              aria-controls="mobileMenu">
        <span class="menu-btn__text">Menu</span>
        <span class="menu-btn__icon" aria-hidden="true"></span>
      </button>

    </div>

  </div>
</header>
</body>
</html>
